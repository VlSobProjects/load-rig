plugins {
    id 'java'
    // The run harness is started as a program: a load run must never be a task of the build,
    // because `./gradlew build` has to stay independent of a running stack.
    id 'application'
}

group = 'loadrig'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'loadrig.run.TransportSmokeRun'
}

tasks.named('run') {
    // A run states its parameters on the command line, so the rig's own properties are carried
    // into the program the build starts; nothing else of the build's environment is.
    systemProperties System.properties.findAll { name, value -> name.startsWith('loadrig.') }
}

tasks.register('validateProfile', JavaExec) {
    description = 'Parses and checks a profile file and the campaign service levels, applying no load'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'loadrig.run.ProfileValidation'
    systemProperties System.properties.findAll { name, value -> name.startsWith('loadrig.') }
    // The file under validation is stated on the command line; the repository's own day
    // profile is the one a bare invocation checks.
    args = [System.getProperty('loadrig.profile', 'profiles/day.json')]
}

tasks.register('runProfile', JavaExec) {
    description = 'Runs a load profile against the stack and lays down the capture artifacts'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'loadrig.run.ProfileRun'
    systemProperties System.properties.findAll { name, value -> name.startsWith('loadrig.') }
    // The profile under load is stated on the command line; the repository's own day profile
    // is the one a bare invocation runs.
    args = [System.getProperty('loadrig.profile', 'profiles/day.json')]
}

tasks.register('provisionPool', JavaExec) {
    description = 'Brings the account pool of a running stack to the configured state'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'loadrig.run.PoolProvisioner'
    systemProperties System.properties.findAll { name, value -> name.startsWith('loadrig.') }
}

repositories {
    mavenCentral()
}

dependencies {
    // The load model and the run harness are built on JMeter driven as code.
    // The DSL embeds JMeter 5.6.x; no JMX files exist in this repository.
    implementation 'us.abstracta.jmeter:jmeter-java-dsl:2.2.1'

    // The profile loader's JSON parser. The DSL already carries this artifact transitively;
    // it is declared explicitly - at the same version - so that the loader of the profile does
    // not depend on a transitive accident of the DSL's next release (DR-2).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
