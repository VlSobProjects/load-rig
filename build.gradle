plugins {
    id 'java'
}

group = 'loadrig'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The load model and the run harness are built on JMeter driven as code.
    // The DSL embeds JMeter 5.6.x; no JMX files exist in this repository.
    implementation 'us.abstracta.jmeter:jmeter-java-dsl:2.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
